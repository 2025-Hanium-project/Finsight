<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight - 로그인</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <!-- 왼쪽 로그인 영역 -->
        <div class="login-side">
            <div class="login-logo">
                <span class="login-logo-icon">📊</span>
                <span class="login-logo-text">FinSight</span>
            </div>
            <p class="login-subtitle">투자 의사결정을 위한 AI 분석 플랫폼</p>
            
            <h1 class="login-title">로그인</h1>
            
            <div class="input-field">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="이메일 주소를 입력하세요" required>
            </div>
            
            <div class="input-field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
            </div>
            
            <div class="password-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">로그인 상태 유지</label>
                </div>
                <a href="{{ url_for('findpwd') }}" class="forgot-link">비밀번호 찾기</a>
            </div>
            
            <button class="login-button" onclick="window.location.href='{{ url_for('index') }}'">로그인</button>
            
            <div class="login-divider">
                <span>또는</span>
            </div>
            
            <div class="social-login">
                <button class="social-button kakao-login">
                    <span class="social-icon">K</span>
                    카카오 계정으로 로그인
                </button>
                <button class="social-button naver-login">
                    <span class="social-icon">N</span>
                    네이버 계정으로 로그인
                </button>
            </div>
            
            <div class="signup-link">
                <p>계정이 없으신가요? <a href="{{ url_for('join') }}">회원가입</a></p>
            </div>
            
            <div class="copyright">
                <p>© 2025 FinSight. All rights reserved.</p>
            </div>
        </div>
        
        <!-- 오른쪽 소개 영역 -->
        <div class="showcase-side">
            <div class="showcase-content">
                <h2 class="showcase-title">AI 기반 투자 분석으로<br>더 나은 투자 결정을</h2>
                <p class="showcase-description">실시간 종목 분석, 맞춤형 투자 전략, 최신 시장 동향까지<br>투자 애널리스트 AI와 함께 시작하세요.</p>
                
                <div class="feature-list">
                    <div class="feature-item">
                        <div class="feature-icon">📈</div>
                        <div class="feature-text">실시간 종목 분석</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">🤖</div>
                        <div class="feature-text">LLM 기반 투자 추천</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-icon">📊</div>
                        <div class="feature-text">포트폴리오 최적화</div>
                    </div>
                </div>
            </div>
            
            <div class="preview-area">
                <div class="preview-image">
                    <div class="chart-box"></div>
                    <div class="data-box">
                        <div class="data-line"></div>
                        <div class="data-line"></div>
                        <div class="data-line"></div>
                        <div class="data-line"></div>
                        <div class="data-line"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
